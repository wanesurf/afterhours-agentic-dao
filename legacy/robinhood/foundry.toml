[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
fuzz.runs = 512

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[profile.fork]
test = "contracts/fork-test"
