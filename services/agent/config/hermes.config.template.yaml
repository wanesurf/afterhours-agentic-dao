# Hosted Hermes profile: default (research/demo mode).
# Merge these settings into the existing profile config instead of replacing
# provider, gateway, or account settings. Hermes resolves ${VAR} in MCP URLs
# and headers at connection time. Keep secret values in server-side storage.
model:
  default: anthropic/claude-sonnet-5
  provider: nous

# Hermes ignores the legacy top-level "toolsets" key. Restrict every surface.
platform_toolsets:
  # Public website chat uses the main agent with server-supplied market evidence.
  api_server: []
  cli: [web, clarify, mcp-pyth]
  telegram: [web, clarify, mcp-pyth]
  discord: [web, clarify, mcp-pyth]
  whatsapp: [web, clarify, mcp-pyth]
  slack: [web, clarify, mcp-pyth]
  signal: [web, clarify, mcp-pyth]
  homeassistant: [web, clarify, mcp-pyth]
  qqbot: [web, clarify, mcp-pyth]
  yuanbao: [web, clarify, mcp-pyth]
  teams: [web, clarify, mcp-pyth]
  google_chat: [web, clarify, mcp-pyth]

agent:
  disabled_toolsets:
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - skills
    - todo
    - kanban
    - memory
    - session_search
    - connections
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use
    - a2a
    - context_engine
    - desktop_ui
    - project

mcp_servers:
  pyth:
    url: https://mcp.pyth.network/mcp
    # Pyth's hosted price tools require access_token as a model-visible tool
    # argument. Use our server-side Arbitrage MCP for live price data instead.
    tools:
      include: [get_symbols, convert_date_to_timestamp]

  # Add only after deploying the read-only MCP with PYTH_PRO_ACCESS_TOKEN in
  # its own server-side secret store and a separate MCP bearer token.
  # afterhours_arbitrage:
  #   url: ${ARBITRAGE_MCP_URL}
  #   headers:
  #     Authorization: Bearer ${ARBITRAGE_MCP_TOKEN}
  #   tools:
  #     include: [get_market_state, scan_opportunities]
