# Legacy optional profile; the website now uses the main default profile.
# Use hermes.config.template.yaml for current setup.
# Hosted Hermes profile: afterhours_holder (public read-only conversation).
# The name is retained for compatibility. Website chat uses anonymous sessions.
# No wallet or token ownership is required; this profile grants no authority.
model:
  default: anthropic/claude-sonnet-5
  provider: nous

# Website API has no tools. Market evidence is supplied by the web backend.
platform_toolsets:
  api_server: []
  cli: [web, mcp-pyth]
  telegram: [web, mcp-pyth]
  discord: [web, mcp-pyth]
  whatsapp: [web, mcp-pyth]
  slack: [web, mcp-pyth]
  signal: [web, mcp-pyth]
  homeassistant: [web, mcp-pyth]
  qqbot: [web, mcp-pyth]
  yuanbao: [web, mcp-pyth]
  teams: [web, mcp-pyth]
  google_chat: [web, mcp-pyth]

agent:
  disabled_toolsets:
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - skills
    - todo
    - kanban
    - memory
    - session_search
    - connections
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use
    - a2a
    - context_engine
    - desktop_ui
    - project

mcp_servers:
  pyth:
    url: https://mcp.pyth.network/mcp
    tools:
      include: [get_symbols, convert_date_to_timestamp]
